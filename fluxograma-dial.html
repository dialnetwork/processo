      :root {
        font-family: "DM Sans", Arial, sans-serif;
        color: #20332e;
        background: #fbfcf9;
        font-synthesis: none;
        --ink: #20332e;
        --muted: #536960;
        --green: #175647;
        --line: #d9e2da;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid #177a62;
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        flex: none;
        stroke: currentColor;
        stroke-width: 1.65;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
      }
      .topbar,
      .heading,
      .footer,
      .editbar {
        flex: none;
        display: flex;
        align-items: center;
        background: #fff;
        gap: 12px;
      }
      .topbar {
        min-height: 59px;
        padding: 9px 27px;
        border-bottom: 1px solid var(--line);
        justify-content: space-between;
      }
      .brand,
      .actions,
      .tabs,
      .zoom-group,
      .legend,
      .edit-tools {
        display: flex;
        align-items: center;
      }
      .brand {
        gap: 14px;
      }
      .wordmark {
        font-size: 27px;
        font-weight: 780;
        letter-spacing: -1.9px;
        color: #175647;
        line-height: 1;
      }
      .brand-unit {
        border-left: 1px solid #cfd9d1;
        padding-left: 14px;
        font-size: 13px;
        font-weight: 560;
        color: var(--muted);
      }
      .actions,
      .edit-tools {
        gap: 8px;
      }
      .btn,
      .icon-btn,
      .phase-tab,
      .route-btn {
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-weight: 620;
      }
      .btn {
        min-height: 36px;
        padding: 7px 13px;
        font-size: 13px;
        line-height: 20px;
      }
      .btn:hover,
      .icon-btn:hover,
      .phase-tab:hover,
      .route-btn:hover {
        background: #f0f5ef;
      }
      .btn.primary {
        background: var(--green);
        color: white;
        border-color: var(--green);
      }
      .btn.primary:hover {
        background: #0e4035;
      }
      .btn.danger {
        color: #954936;
        border-color: #e6cfc8;
      }
      .btn.soft {
        background: #f3f7f2;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        padding: 0;
        border-color: transparent;
        background: transparent;
      }
      .heading {
        justify-content: space-between;
        gap: 18px;
        min-height: 70px;
        padding: 12px 27px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        color: #18352c;
        font-size: clamp(24px, 2.5vw, 34px);
        line-height: 1.14;
        letter-spacing: -1.25px;
        font-weight: 680;
      }
      .tabs {
        gap: 4px;
        overflow: auto;
        scrollbar-width: thin;
      }
      .phase-tab {
        white-space: nowrap;
        font-size: 12.5px;
        min-height: 32px;
        border-color: transparent;
        background: transparent;
        padding: 5px 9px;
        font-weight: 570;
        color: #4a5a53;
      }
      .phase-tab[aria-pressed="true"] {
        background: #e8f2e9;
        color: #164b3e;
        box-shadow: inset 0 0 0 1px #c2dacb;
      }
      .phase-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--phase);
        flex: none;
      }
      .editbar {
        min-height: 42px;
        justify-content: space-between;
        border-bottom: 1px solid #c8dbce;
        background: #eef5ec;
        padding: 4px 27px;
      }
      .edit-tools .btn {
        min-height: 29px;
        padding: 3px 9px;
        font-size: 12px;
      }
      .editbar small {
        color: #42594b;
        font-size: 12px;
      }
      .board-shell {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
        isolation: isolate;
      }
      #viewport {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        overflow: hidden;
        background-color: #eef2ec;
        background-image: radial-gradient(#bfcac0 0.8px, transparent 0.9px);
        background-size: 16px 16px;
        touch-action: none;
        user-select: none;
        overscroll-behavior: contain;
        cursor: grab;
      }
      #viewport.panning {
        cursor: grabbing;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        font-family: "DM Sans", Arial, sans-serif;
      }
      #canvas text {
        user-select: none;
        pointer-events: none;
      }
      [data-node],
      .phase-rail {
        cursor: pointer;
      }
      .editing [data-node] {
        cursor: move;
      }
      [data-node]:focus,
      .phase-rail:focus,
      .edge:focus {
        outline: none;
      }
      [data-node]:focus-visible .node-body,
      [data-node]:hover .node-body,
      .phase-rail:focus-visible .phase-hit {
        stroke: #207863;
        stroke-width: 2.8;
      }
      [data-node].current .node-body {
        stroke: #155544;
        stroke-width: 3.3;
      }
      .editing .edge {
        cursor: pointer;
      }
      .editing .edge:hover .edge-line,
      .editing .edge:focus-visible .edge-line,
      .edge.current .edge-line {
        stroke: #15684f;
        stroke-width: 3.6;
      }
      .footer {
        min-height: 44px;
        border-top: 1px solid var(--line);
        padding: 4px 22px;
        justify-content: space-between;
        gap: 14px;
      }
      .legend {
        list-style: none;
        padding: 0;
        margin: 0;
        gap: 16px;
        flex-wrap: wrap;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        color: #41534c;
        font-size: 12px;
      }
      .symbol {
        width: 15px;
        height: 10px;
        background: #fff;
        border: 1.4px solid #627e74;
        border-radius: 3px;
        display: inline-block;
      }
      .symbol.decision {
        width: 10px;
        height: 10px;
        border-radius: 1px;
        border-color: #9b742b;
        background: #fff5d9;
        transform: rotate(45deg);
        margin: 0 2px;
      }
      .symbol.end {
        border-radius: 8px;
        background: #f8e9e4;
        border-color: #ae6a56;
      }
      .symbol.loop {
        height: 0;
        border: 0;
        border-top: 2px dashed #95702d;

        camera = { scale, x, y };
        fitted = false;
        applyCamera();
      }
      function drawTabs() {
        const tabs = $("tabs");
        tabs.replaceChildren();
        function tab(id, label, color) {
          const el = html("button", undefined, "phase-tab");
          el.type = "button";
          el.dataset.jump = id;
          el.setAttribute("aria-pressed", String(activePhase === id));
          if (color) {
            const dot = html("i", undefined, "phase-dot");
            dot.style.setProperty("--phase", color);
            el.append(dot);
          } else el.append(icon("overview"));
          el.append(document.createTextNode(label));
          tabs.append(el);
        }
        tab("all", "Visão geral");
        for (const p of board.phases) tab(p.id, p.short, p.color);
      }
      function closePanel() {
        $("panel").hidden = true;
        selected = null;
        document.querySelectorAll("#world .current").forEach((e) => e.classList.remove("current"));
      }
      function openPanel(tag, title, selection, mode) {
        selected = selection;
        document.querySelectorAll("#world .current").forEach((e) => e.classList.remove("current"));
        if (selection) {
          const el =
            selection.type === "node"
              ? $("cards").querySelector('[data-node="' + CSS.escape(selection.id) + '"]')
              : $("lines").querySelector('[data-edge="' + CSS.escape(selection.id) + '"]');
          if (el) el.classList.add("current");
        }
        $("panel").hidden = false;
        $("panel").scrollTop = 0;
        $("panel-tag").textContent = tag;
        const body = $("panel-body");
        body.replaceChildren(html("h2", title));
        return body;
      }
      function action(label, fn, cls = "btn") {
        const btn = html("button", label, cls);
        btn.type = "button";
        btn.addEventListener("click", fn);
        return btn;
      }
      function nextSteps(node, seen = new Set()) {
        if (seen.has(node.id)) return [];
        const visited = new Set(seen).add(node.id);
        return board.edges
          .filter((e) => e.source === node.id)
          .flatMap((e) => {
            const target = nodeBy(e.target);
            return target.kind === "join"
              ? nextSteps(target, visited)
              : [{ target, label: e.label }];
          });
      }
      function showNode(id, center = false) {
        const n = nodeBy(id);
        if (!n) return;
        if (editing) {
          editNode(n);
          if (center) revealNode(n, true);
          return;
        }
        const step = stages.get(n.stage);
        const body = openPanel(
          phaseOf(n).name + "  /  " + step.id + " · " + step.name,
          plainTitle(n),
          { type: "node", id },
          "read",
        );
        if (n.owner) {
          body.append(
            html("h3", n.owner === "Pedro" ? "Responsável" : "Equipe de referência"),
            html("p", n.owner),
          );
        }
        if (n.detail) {
          const list = html("ul");
          for (const line of n.detail.split("\n").filter((s) => s.trim()))
            list.append(html("li", line));
          body.append(html("h3", "O que fazer"), list);
        }
        const routes = nextSteps(n);
        if (routes.length) {
          const group = html("div", undefined, "routes");
          for (const { target, label } of routes) {
            const btn = html("button", undefined, "route-btn");
            const text = html("span");
            if (label) text.append(html("span", label, "route-label"));
            text.append(document.createTextNode(plainTitle(target)));
            btn.append(text, icon("next"));
            btn.addEventListener("click", () => showNode(target.id, true));
            group.append(btn);
          }
          body.append(html("h3", "Próximos passos"), group);
        }
        revealNode(n, center);
      }
      function field(form, name, label, type, value, options = []) {
        const wrapper = html("label", undefined, "field"),
          caption = html("span", label);
        caption.id = "field-label-" + name;
        wrapper.append(caption);
        const input = html(
          type === "select" ? "select" : type === "textarea" ? "textarea" : "input",
        );
        input.name = name;
        input.setAttribute("aria-labelledby", caption.id);
        if (type === "select") for (const [id, text] of options) input.append(new Option(text, id));
        else if (type === "textarea") input.rows = 3;
        else input.type = "text";
        input.value = value ?? "";
        wrapper.append(input);
        form.append(wrapper);
        return input;
      }
      function applyPendingForm() {
        const form = $("panel").hidden ? null : $("panel-body").querySelector("form");
        if (!form || form.dataset.dirty !== "true") return true;
        if (!form.reportValidity()) return false;
        form.requestSubmit();
        return !form.isConnected || form.dataset.dirty !== "true";
      }
      function formButtons(form, onApply, onDelete) {
        const markDirty = () => {
          form.dataset.dirty = "true";
        };
        form.addEventListener("input", markDirty);
        form.addEventListener("change", markDirty);
        const buttons = html("div", undefined, "form-actions"),
          apply = html("button", "Aplicar", "btn primary");
        apply.type = "submit";
        buttons.append(apply, action("Cancelar", closePanel));
        form.append(buttons);
        const error = html("output", undefined, "form-message");
        form.append(error);
        form.addEventListener("submit", (ev) => {
          ev.preventDefault();
          const result = onApply(new FormData(form));
          if (typeof result === "string") error.textContent = result;
          else form.dataset.dirty = "false";
        });
        if (onDelete) {
          const row = html("div", undefined, "delete-action");
          row.append(action("Excluir", onDelete, "btn danger"));
          form.append(row);
        }
      }
      function freePlace(stage, preferred) {
        const p = phases.get(stages.get(stage).phase);
        const first = preferred || point(330, p.top + 198),
          cols = Math.max(6, Math.ceil((boardSize().w - 250) / 258));
        const spots = [];
        for (const y of [p.top + 198, p.top + 82]) {
          for (let i = 0; i < cols + 2; i++) spots.push(point(330 + 258 * i, y));
        }
        spots.sort(
          (a, b) =>
            Math.hypot(a.x - first.x, a.y - first.y) - Math.hypot(b.x - first.x, b.y - first.y),
        );
        return (
          spots.find((s) =>
            [...geometry.values()].every(
              (b) => Math.abs(b.x - s.x) > (b.w + 218) / 2 || Math.abs(b.y - s.y) > (b.h + 88) / 2,
            ),
          ) || point(boardSize().w + 115, p.top + 82)
        );
      }
      function uniqueId(prefix) {
        const value =
          globalThis.crypto?.randomUUID?.() ||
          Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
        return prefix + "-" + value;
      }
      const nodeOptions = () => board.nodes.map((n) => [n.id, n.stage + " · " + plainTitle(n)]);
      function editNode(n) {
        const currentPhase = phases.has(activePhase) ? activePhase : board.phases[0].id;
        const defaultStage = n?.stage || board.stages.find((s) => s.phase === currentPhase).id;
        const body = openPanel(
          n ? phaseOf(n).name : "Edição do quadro",
          n ? "Editar caixa" : "Adicionar caixa",
          n ? { type: "node", id: n.id } : null,
          "node",
        );
        const form = html("form");
        body.append(form);
        const name = field(form, "title", "Texto da caixa", "text", n?.title);
        name.required = true;
        field(
          form,
          "stage",
          "Etapa",
          "select",
          defaultStage,
          board.stages.map((s) => [
            s.id,
            s.id + " · " + s.name + " — " + phases.get(s.phase).short,
          ]),
        );
        const kinds = [
          ["task", "Atividade"],
          ["decision", "Decisão"],
          ["end", "Encerramento"],
        ];
        if (n?.kind === "join") kinds.push(["join", "Junção"]);
        field(form, "kind", "Forma", "select", n?.kind || "task", kinds);
        field(form, "owner", "Responsável", "text", n?.owner);
        field(form, "detail", "Detalhes da atividade", "textarea", n?.detail);
        formButtons(
          form,
          (data) => {
            const title = data.get("title").trim();
            if (!title) return "Informe o texto da caixa.";
            const stage = data.get("stage"),
              obj = n || { id: uniqueId("caixa"), primary: false, kicker: "" };
            commit(
              () => {
                if (!n || phaseOf(n).id !== stages.get(stage).phase)
                  Object.assign(obj, freePlace(stage, n));
                Object.assign(obj, {
                  title,
                  stage,
                  kind: data.get("kind"),
                  owner: data.get("owner").trim(),
                  detail: data.get("detail").trim(),
                });
                if (!n) board.nodes.push(obj);
              },
              n ? "Caixa atualizada" : "Caixa adicionada",
            );
            editNode(obj);
            revealNode(obj, !n);
          },
          n
            ? () => {
                commit(() => {
                  board.nodes = board.nodes.filter((x) => x.id !== n.id);
                  board.edges = board.edges.filter((e) => e.source !== n.id && e.target !== n.id);
                }, "Caixa e conexões removidas");
                closePanel();
              }
            : null,
        );
        if (n) {
          const tools = html("div", undefined, "form-actions");
          tools.append(action("Conectar a outra caixa", () => editEdge(null, n.id), "btn soft"));
          body.append(tools);
          revealNode(n);
        } else name.focus();
      }
      function editEdge(e, sourceId) {
        const body = openPanel(
          "Conexões",
          e ? "Editar conexão" : "Adicionar conexão",
          e ? { type: "edge", id: e.id } : null,
          "edge",
        );
        const form = html("form");
        body.append(form);
        const opts = nodeOptions();
        const source = field(
          form,
          "source",
          "Da caixa",
          "select",
          e?.source || sourceId || opts[0]?.[0],
          opts,
        );
        const target = field(form, "target", "Para a caixa", "select", e?.target || "", [
          ["", "Selecione a caixa de destino"],
          ...opts,
        ]);
        target.required = true;
        field(form, "label", "Texto da seta", "text", e?.label);
        field(form, "style", "Tipo de caminho", "select", e?.style || "flow", [
          ["flow", "Fluxo"],
          ["return", "Retorno ou revisão"],
          ["stop", "Encerramento"],
        ]);
        formButtons(
          form,
          (data) => {
            if (source.value === target.value)
              return "Escolha duas caixas diferentes para a conexão.";
            const obj = e || { id: uniqueId("seta") };
            commit(
              () => {
                if (obj.source !== source.value || obj.target !== target.value) {
                  delete obj.out;
                  delete obj.entry;
                  delete obj.route;
                }
                Object.assign(obj, {
                  source: source.value,
                  target: target.value,
                  label: data.get("label").trim(),
                  style: data.get("style"),
                });
                if (!e) board.edges.push(obj);
              },
              e ? "Conexão atualizada" : "Conexão adicionada",
            );
            editEdge(obj);
          },
          e
            ? () => {
                commit(() => {
                  board.edges = board.edges.filter((x) => x.id !== e.id);
                }, "Conexão removida");
                closePanel();
              }
            : null,
        );
      }
      function editPhase(id) {
        const original = board.phases.find((p) => p.id === id);
        const body = openPanel("Fases do processo", "Editar fase", null, "phase");
        const form = html("form");
        body.append(form);
        field(form, "name", "Nome da fase", "text", original.name).required = true;
        field(form, "short", "Nome na navegação", "text", original.short).required = true;
        const members = board.stages.filter((s) => s.phase === id);
        for (const s of members)
          field(form, s.id, "Nome da etapa " + s.id, "text", s.name).required = true;
        formButtons(form, (data) => {
          if ([...data.values()].some((v) => !v.trim()))
            return "Preencha os nomes da fase e das etapas.";
          commit(() => {
            original.name = data.get("name").trim();
            original.short = data.get("short").trim();
            for (const s of members) s.name = data.get(s.id).trim();
          }, "Fase atualizada");
          closePanel();
        });
      }
      function setEditing(value) {
        if (!value && !applyPendingForm()) return;
        const keep = selected && selected.type === "node" ? selected.id : null;
        editing = value;
        document.body.classList.toggle("editing", editing);
        $("editbar").hidden = !editing;
        $("edit").setAttribute("aria-pressed", String(editing));
        $("edit").querySelector("span").textContent = editing ? "Concluir edição" : "Editar quadro";
        $("edit")
          .querySelector("use")
          .setAttribute("href", editing ? "#i-check" : "#i-edit");
        closePanel();
        drawGraph();
        if (keep) showNode(keep);
        defaultHint();
      }
      function downloadBoard() {
        if (!applyPendingForm()) return;
        const copy = new DOMParser().parseFromString(sourcePage, "text/html");
        copy.getElementById("board-data").textContent = JSON.stringify(board, null, 2).replace(
          /</g,
          "\\u003c",
        );
        const blob = new Blob(["<!doctype html>\n", copy.documentElement.outerHTML], {
          type: "text/html;charset=utf-8",
        });
        const url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = "fluxograma-dial.html";
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        status("Cópia do quadro preparada para download.", true);
      }

      function itemAt(target) {
        const node = target.closest("[data-node]");
        if (node) return { type: "node", id: node.dataset.node };
        const edge = target.closest("[data-edge],[data-edge-label]");
        if (edge && editing)
          return { type: "edge", id: edge.dataset.edge || edge.dataset.edgeLabel };
        const phase = target.closest("[data-phase]");
        if (phase) return { type: "phase", id: phase.dataset.phase };
        return null;
      }
      function activate(item) {
        if (item?.type === "node") showNode(item.id);
        else if (item?.type === "edge" && editing) editEdge(edgeBy(item.id));
        else if (item?.type === "phase") {
          if (editing) editPhase(item.id);
          else {
            closePanel();
            focusPhase(item.id);
          }
        } else closePanel();
      }
      const pointers = new Map();
      let gesture = null,
        pinch = null,
        frame = 0;
      function localPoint(event) {
        const bounds = viewport.getBoundingClientRect();
        return point(event.clientX - bounds.left, event.clientY - bounds.top);
      }
      function distance(a, b) {
        return Math.hypot(b.x - a.x, b.y - a.y);
      }
      function mid(a, b) {
        return point((a.x + b.x) / 2, (a.y + b.y) / 2);
      }
      function cancelNodeDrag() {
        if (gesture?.snapshot) {
          board = gesture.snapshot;
          drawGraph();
        }
      }
      function redrawSoon() {
        if (frame) return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          drawGraph();
        });
      }
      viewport.addEventListener("pointerdown", (ev) => {
        if (ev.button !== 0 && ev.button !== 1) return;
        const pos = localPoint(ev);
        pointers.set(ev.pointerId, pos);
        viewport.setPointerCapture(ev.pointerId);
        if (pointers.size === 2) {
          cancelNodeDrag();
          const [a, b] = [...pointers.values()],
            c = mid(a, b);
          pinch = {
            distance: Math.max(1, distance(a, b)),
            scale: camera.scale,
            wx: (c.x - camera.x) / camera.scale,
            wy: (c.y - camera.y) / camera.scale,
          };
          gesture = null;
          return;
        }
        if (pointers.size > 2) return;
        const item = itemAt(ev.target),
          n = item?.type === "node" && editing && ev.button === 0 ? nodeBy(item.id) : null;
        gesture = {
          p: pos,
          start: pos,
          item,
          n,
          nx: n?.x,
          ny: n?.y,
          moved: false,
          panOnly: ev.button === 1,
        };
      });
      viewport.addEventListener("pointermove", (ev) => {
        if (!pointers.has(ev.pointerId)) return;
        const pos = localPoint(ev);
        pointers.set(ev.pointerId, pos);
        if (pinch && pointers.size >= 2) {
          const [a, b] = [...pointers.values()],
            c = mid(a, b);
          const scale = clamp((pinch.scale * distance(a, b)) / pinch.distance, 0.1, 2.8);
          camera = { scale, x: c.x - pinch.wx * scale, y: c.y - pinch.wy * scale };
          fitted = false;
          activePhase = null;
          applyCamera();
          return;
        }
        if (!gesture) return;
        const g = gesture;
        if (!g.moved && distance(pos, g.start) < 4) return;
        if (!g.moved && g.n) g.snapshot = clone(board);
        g.moved = true;
        if (g.n) {
          const b = geometry.get(g.n.id),
            p = phaseOf(g.n);
          const x = g.nx + (pos.x - g.start.x) / camera.scale,
            y = g.ny + (pos.y - g.start.y) / camera.scale;
          g.n.x = Math.max(204 + b.w / 2, Math.round(x / 2) * 2);
          g.n.y = clamp(Math.round(y / 2) * 2, p.top + 8 + b.h / 2, p.top + p.height - 8 - b.h / 2);
          redrawSoon();
        } else {
          camera.x += pos.x - g.p.x;
          camera.y += pos.y - g.p.y;
          fitted = false;
          activePhase = null;
          viewport.classList.add("panning");
          applyCamera();
        }
        g.p = pos;
      });
      function finishGesture(ev, abort) {
        if (!pointers.has(ev.pointerId)) return;
        pointers.delete(ev.pointerId);
        if (pinch) {
          if (pointers.size < 2) pinch = null;
          gesture = null;
          drawTabs();
        } else if (gesture) {
          const g = gesture;
          if (abort) cancelNodeDrag();
          else if (g.moved && g.n) {
            if (g.n.x !== g.nx || g.n.y !== g.ny) {
              pushHistory(g.snapshot);
              drawGraph();
              persist("Caixa reposicionada");
            }
          } else if (!g.moved && !g.panOnly) activate(g.item);
          else if (g.moved) drawTabs();
          gesture = null;
        }
        if (viewport.hasPointerCapture(ev.pointerId)) viewport.releasePointerCapture(ev.pointerId);
        viewport.classList.remove("panning");
      }
      viewport.addEventListener("pointerup", (ev) => finishGesture(ev, false));
      viewport.addEventListener("pointercancel", (ev) => finishGesture(ev, true));
      viewport.addEventListener(
        "wheel",
        (ev) => {
          ev.preventDefault();
          const pt = localPoint(ev);
          if (ev.ctrlKey || ev.metaKey) zoomAt(Math.exp(-ev.deltaY * 0.006), pt.x, pt.y);
          else {
            const unit = ev.deltaMode === 1 ? 18 : ev.deltaMode === 2 ? viewport.clientHeight : 1;
            camera.x -= (ev.deltaX + (ev.shiftKey ? ev.deltaY : 0)) * unit;
            camera.y -= (ev.shiftKey ? 0 : ev.deltaY) * unit;
            fitted = false;
            activePhase = null;
            applyCamera();
            drawTabs();
          }
        },
        { passive: false },
      );

      $("tabs").addEventListener("click", (ev) => {
        const button = ev.target.closest("[data-jump]");
        if (!button) return;
        closePanel();
        if (button.dataset.jump === "all") fitBoard();
        else focusPhase(button.dataset.jump);
      });
      $("fit").addEventListener("click", () => {
        closePanel();
        fitBoard();
      });
      $("zoom-in").addEventListener("click", () => zoomAt(1.25));
      $("zoom-out").addEventListener("click", () => zoomAt(1 / 1.25));
      $("close").addEventListener("click", closePanel);
      $("download").addEventListener("click", downloadBoard);
      $("edit").addEventListener("click", () => setEditing(!editing));
      $("add-node").addEventListener("click", () => editNode(null));
      $("add-edge").addEventListener("click", () =>
        editEdge(null, selected?.type === "node" ? selected.id : null),
      );
      $("undo").addEventListener("click", undo);
      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") {
          closePanel();
          return;
        }
        if (ev.target.matches("input,textarea,select,[contenteditable]")) return;
        if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z" && editing) {
          ev.preventDefault();
          undo();
          return;
        }
        const item = itemAt(ev.target);
        if (item && (ev.key === "Enter" || ev.key === " ")) {
          ev.preventDefault();
          activate(item);
          return;
        }
        if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
        if (ev.key === "+" || ev.key === "=") {
          zoomAt(1.25);
          return;
        }
        if (ev.key === "-") {
          zoomAt(0.8);
          return;
        }
        if (ev.key.toLowerCase() === "f") {
          closePanel();
          fitBoard();
          return;
        }
        if (ev.target === $("canvas") && ev.key.startsWith("Arrow")) {
          const delta = {
            ArrowLeft: [60, 0],
            ArrowRight: [-60, 0],
            ArrowUp: [0, 60],
            ArrowDown: [0, -60],
          }[ev.key];
          if (delta) {
            ev.preventDefault();
            camera.x += delta[0];
            camera.y += delta[1];
            activePhase = null;
            fitted = false;
            applyCamera();
            drawTabs();
          }
        }
      });
      new ResizeObserver(() => {
        if (!initialized) return;
        if (fitted) fitBoard();
        else if (activePhase && activePhase !== "all") focusPhase(activePhase);
      }).observe(viewport);
      async function init() {
        try {
          await document.fonts.load('620 20px "DM Sans"');
        } catch {}
        makeDefs();
        drawGraph();
        defaultHint();
        initialized = true;
        if (viewport.clientWidth < 610) focusPhase(board.phases[0].id);
        else fitBoard();
      }
      init();
    </script>
  </body>
</html>
